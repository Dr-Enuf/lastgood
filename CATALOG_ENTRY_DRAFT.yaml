name: lastgood
description: >-
  LastGood: know which checks passed on which tested state, and what
  restoring files won't undo. Preset checks (file opens, words present,
  files exist, page loads) run after write_file/patch in opted-in
  projects and on demand; results are PASS/FAIL/UNKNOWN with a content
  fingerprint so changed files mark old results stale. /lastgood blame
  shows where checks first failed plus bounded configured-string presence deltas, not causality. A ledger lists recognised tool calls a
  file rollback won't undo, without storing their arguments.
  Disclosure: the optional url_loads check fetches the http(s) address
  you configure. No shell commands, credentials or background processes.
  Refuses a home folder, drive/filesystem root or system folder as the
  project, and explains invalid setups with the accepted check types.
repo: https://github.com/Dr-Enuf/lastgood
sha: TODO  # fill in the exact 40-hex commit after GitHub upload, never a branch/tag
license: MIT
tier: community
category: tools
maintainer: Kenneth Ausmus (Dr-Enuf)
capabilities:
  tools:
    - lastgood_check
    - lastgood_status
    - lastgood_blame
    - lastgood_report
    - lastgood_setup
  hooks:
    - pre_tool_call
    - post_tool_call
  env_vars: []
# Only Hermes 0.22.7 interfaces were read; v0.2.0 host checks passed (historical); v0.3.0 host gates pass; model edit PASS/PASS/FAIL, real interactive user slash rollback + explicit fresh PASS; automatic/model-driven recovery unproven.
requires_hermes: ">=0.22.7"
